name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    # Weekly early warning: run the tests against the newest Home Assistant
    - cron: "0 5 * * 1"

jobs:
  lint-and-test:
    name: Lint + Tests (${{ matrix.ha }} HA)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [pinned, latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build card bundle
        run: |
          cd card-src
          npm install
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ "${{ matrix.ha }}" = "latest" ]; then
            python -m pip install --upgrade homeassistant
          fi
          python -m pip show homeassistant | grep -i '^version'

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q tests
