name: Hassfest code validation

on:
  push:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: validation
        uses: home-assistant/actions/hassfest@master