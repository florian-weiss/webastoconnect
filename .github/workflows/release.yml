name: Release

# Publish a GitHub release (e.g. tag v1.2.2) and this workflow builds the
# card, sets the manifest version from the tag and attaches webastoconnect.zip,
# which is what HACS installs (hacs.json: zip_release).

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to package, for example v1.2.2
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
  release_zip_file:
    name: Build and attach webastoconnect.zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set manifest version to ${{ env.RELEASE_TAG }}
        run: |
          python3 .github/scripts/update_hacs_manifest.py --version "${{ env.RELEASE_TAG }}" --path /custom_components/webastoconnect/

      - name: Build Webasto Connect Card
        run: |
          cd card-src
          npm install
          npm run build

      - name: Create zip
        run: |
          cd custom_components/webastoconnect
          zip webastoconnect.zip -r ./

      - name: Upload zip to release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./custom_components/webastoconnect/webastoconnect.zip
          asset_name: webastoconnect.zip
          tag: ${{ env.RELEASE_TAG }}
          overwrite: true
